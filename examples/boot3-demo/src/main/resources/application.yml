spring:
  application:
    name: boot3-demo
  datasource:
    url: jdbc:h2:mem:demo
    driver-class-name: org.h2.Driver
  jpa:
    hibernate:
      ddl-auto: create-drop
    show-sql: true
  data:
    web:
      pageable:
        # Caps ?size= for every Pageable parameter (Spring Data's default is 2000).
        max-page-size: 100
  h2:
    console:
      enabled: true
server:
  port: 8080
