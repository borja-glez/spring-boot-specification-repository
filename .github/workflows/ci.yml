name: CI

on:
  pull_request:

jobs:
  library-quality:
    name: quality (JDK ${{ matrix.test-java }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        test-java: [21, 25]
    steps:
      - uses: actions/checkout@v7
      # The last listed version becomes JAVA_HOME, so Gradle and compilation stay on Java 21.
      # setup-java exports JAVA_HOME_<major>_X64 for every installed version.
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: |
            25
            21
      - uses: gradle/actions/setup-gradle@v6
      - name: Verify library quality
        run: >-
          ./gradlew quality
          -PtestJavaVersion=${{ matrix.test-java }}
          -Porg.gradle.java.installations.fromEnv=JAVA_HOME_21_X64,JAVA_HOME_25_X64

  compatibility:
    name: Compatibility (${{ matrix.boot-line }}, JDK ${{ matrix.test-java }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        boot-line: [boot3, boot4]
        test-java: [21, 25]
    env:
      DOCKER_HOST: unix:///var/run/docker.sock
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: |
            25
            21
      - uses: gradle/actions/setup-gradle@v6
      - name: Verify Boot 3 compatibility
        if: matrix.boot-line == 'boot3'
        run: >-
          ./gradlew verifyBoot3Compatibility
          -PtestJavaVersion=${{ matrix.test-java }}
          -Porg.gradle.java.installations.fromEnv=JAVA_HOME_21_X64,JAVA_HOME_25_X64
      - name: Verify Boot 4 compatibility
        if: matrix.boot-line == 'boot4'
        run: >-
          ./gradlew verifyBoot4Compatibility
          -PtestJavaVersion=${{ matrix.test-java }}
          -Porg.gradle.java.installations.fromEnv=JAVA_HOME_21_X64,JAVA_HOME_25_X64
